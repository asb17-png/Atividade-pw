<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada</title>
</head>
<body>
    <h1>Tabuada de Multiplicação</h1>
    <p id="mensagem"></p>
    <ul id="tabuada"></ul>

    <script>
        const entrada = prompt("Digite um número para ver a tabuada:");
        const numero = Number(entrada);
        const mensagem = document.getElementById("mensagem");
        const tabuada = document.getElementById("tabuada");

        if (entrada === null || entrada.trim() === "" || !Number.isFinite(numero)) {
            mensagem.textContent = "Por favor, insira um número válido.";
        } else {
            mensagem.textContent = `Tabuada do ${numero}:`;

            for (let multiplicador = 1; multiplicador <= 10; multiplicador++) {
                const item = document.createElement("li");
                item.textContent = `${numero} x ${multiplicador} = ${numero * multiplicador}`;
                tabuada.appendChild(item);
            }
        }
    </script>
</body>
</html>
