<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soma dos Números Pares</title>
</head>
<body>
    <h1>Soma dos 100 números pares</h1>
    <p id="resultado"></p>

    <script>
        let soma = 0;

        for (let numero = 1; numero <= 100; numero++) {
            if (numero % 2 === 0) {
                soma += numero;
            }
        }

        console.log(`A soma dos números pares de 1 a 100 é ${soma}.`);
        document.getElementById("resultado").textContent =
            `A soma dos números pares de 1 a 100 é ${soma}.`;
    </script>
</body>
</html>
